<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Películas y Series</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1b1b1b;
            padding: 40px 20px;
        }
        .contenedor {
            max-width: 1000px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: #f5c542;
            font-size: 42px;
            margin-bottom: 10px;
        }
        .subtitulo {
            text-align: center;
            color: #dddddd;
            font-size: 20px;
            margin-bottom: 25px;
        }
        /* DECORACIÓN DE CINE */
        .pelicula {
            text-align: center;
            color: #f5c542;
            font-size: 35px;
            margin-bottom: 20px;
        }
        .linea {
            height: 5px;
            background: #f5c542;
            margin-bottom: 30px;
        }
        /* GALERÍA */
        .galeria {
            background: #292929;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .fotos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }
        .foto {
            background: #111111;
            border: 3px solid #f5c542;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .foto img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 6px;
        }
        .foto h2 {
            color: #f5c542;
            font-size: 20px;
            margin: 12px 0 5px;
        }
        .foto p {
            color: #dddddd;
            font-size: 15px;
            margin: 5px;
        }
        /* BOTÓN */
        .volver {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 28px;
            background: #f5c542;
            color: #1b1b1b;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .volver:hover {
            background: #ffffff;
        }
        /* CELULAR */
        @media (max-width: 700px) {
            .fotos {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 450px) {
            .fotos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>🎬 Mis Películas y Series</h1>
        <div class="subtitulo">
            Mis favoritas
        </div>
        <div class="pelicula">
            ★ ★ ★ ★ ★
        </div>
        <div class="linea"></div>
        <div class="galeria">
            <div class="fotos">
                <!-- PELÍCULA 1 -->
                <div class="foto">
                    <img src="https://m.media-amazon.com/images/M/MV5BNjgzZDFkMWItODUwZC00YjRiLTk2YWQtMWEwMzU2ZGIwZTFjXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Película 1">
                    <h2>miraculous ladybug</h2>
                    <p>Mi película favorita</p>
                </div>
                <!-- PELÍCULA 2 -->
                <div class="foto">
                    <img src="https://m.media-amazon.com/images/M/MV5BMzRlNTVlMjgtYmJmZC00NDBmLWE5NzUtMWVjNmRmMzgwM2JlXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Película 2">
                    <h2>Mon Laferte, te amo</h2>
                    <p>Una de mis favoritas</p>
                </div>
                <!-- PELÍCULA 3 -->
                <div class="foto">
                    <img src="https://mx.web.img2.acsta.net/pictures/22/01/14/19/22/2108595.png" alt="Película 3">
                    <h2>estamos muertos</h2>
                    <p>Una serie que me gusta</p>
                </div>
                <!-- PELÍCULA 4 -->
                <div class="foto">
                    <img src="https://m.media-amazon.com/images/M/MV5BMjAwOTk2MGItZTlmYS00Yzk5LTgyNTYtMjkxY2FkZWI1NzcxXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Película 4">
                    <h2>malefica</h2>
                    <p>Una película especial</p>
                </div>
                <!-- PELÍCULA 5 -->
                <div class="foto">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfgGxK400dFYkwpgU4vCaJ82Vl6CbhBSK4NsTTEerTzGKXqtROYpjjKTk&s=10" alt="Película 5">
                    <h2>no se aceptan devoluciones</h2>
                    <p>Otra de mis favoritas</p>
                </div>
            </div>
        </div>
        <a href="index.html" class="volver">
            Volver a Mi Familia
        </a>
    </div>
</body>
</html>
