<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Papá</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dbeafe;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 45px;
            margin-bottom: 30px;
        }

        .tarjeta {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.20);
        }

        .foto {
            text-align: center;
            margin-bottom: 25px;
        }

        .foto img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid #60a5fa;
        }

        .informacion {
            margin-top: 25px;
        }

        .seccion {
            background: #eff6ff;
            padding: 18px;
            margin: 15px 0;
            border-radius: 15px;
        }

        .seccion h2 {
            color: #1e40af;
            margin-top: 0;
        }

        .seccion p {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .frase {
            text-align: center;
            margin: 30px 10px;
            font-size: 24px;
            color: #1e40af;
            font-style: italic;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 12px;
        }

        .volver:hover {
            background: #1d4ed8;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Mi Papá</h1>

        <div class="tarjeta">

            <!-- FOTO -->
            <div class="foto">
                <img src="imagenes\papá.png" alt="Foto de mi papá">
            </div>

            <div class="informacion">

                <!-- NOMBRE -->
                <div class="seccion">
                    <h2>Nombre</h2>
                    <p>Cesar Geovani Godinez Izol</p>
                </div>

                <!-- GUSTOS -->
                <div class="seccion">
                    <h2>Gustos y pasatiempos</h2>
                    <p>
                        Le gusta escuchar música, pasar tiempo con la familia
                        y disfrutar de sus actividades favoritas.
                    </p>
                </div>

                <!-- PELÍCULA -->
                <div class="seccion">
                    <h2>pelicula favorita</h2>
                    <p>paseo por las nubes</p>
                </div>

                <!-- FRASE -->
                <div class="frase">
                    "todo tiene solucion menos la muerte."
                </div>

            </div>

            <!-- VOLVER -->
            <a href="index.html" class="volver">
                Volver a Mi Familia
            </a>

        </div>

    </div>

</body>
</html>
